<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shree Vitthal Rakhumai Temple | Amberkarwadi</title>
  <meta name="description"
    content="Welcome to Shree Vitthal Rakhumai Temple in Amberkarwadi. Join us for divine celebrations, explore our history, and contribute to building our new temple." />
  <meta name="author" content="Vitthal-Rakhumai Temple Seva Mandal" />

  <!-- Optimize font loading: preconnect early, load fonts asynchronously -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Load fonts asynchronously to prevent render blocking -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
  </noscript>

  <meta property="og:title" content="Shree Vitthal Rakhumai Temple | Amberkarwadi" />
  <meta property="og:description"
    content="Welcome to Vitthal Rakhumai Temple. Experience divine spirituality and join our sacred celebrations." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Preload critical resources -->
  <link rel="modulepreload" href="/src/main.jsx" />

  <style>
    /* Critical above-the-fold styles - Inline for FCP */
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #4a0f0f;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
      background: #4a0f0f;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Prevent layout shift */
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
</body>

</html>
