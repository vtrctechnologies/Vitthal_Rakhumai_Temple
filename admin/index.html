<head>
  <meta charset="UTF-8" />

  <title>VR Temple Admin Panel</title>
  <meta name="description"
    content="Admin panel for VR Temple management" />
  <meta name="author" content="VR Temple Admin" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <meta property="og:title" content="Vitthal Rakhumai Temple | Ambere Village" />
  <meta property="og:description"
    content="Welcome to Vitthal Rakhumai Temple. Experience divine spirituality and join our sacred celebrations." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
</body>

</html>
